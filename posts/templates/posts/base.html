<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mening blogim{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6fb; }
    .navbar { background: linear-gradient(135deg, #667eea, #764ba2); }
    .post-card { border: none; border-radius: 16px; transition: transform .2s, box-shadow .2s; }
    .post-card:hover { transform: translateY(-4px); box-shadow: 0 10px 25px rgba(0,0,0,.12); }
    .post-card a { text-decoration: none; color: #2d3748; }
    .post-content { font-size: 1.15rem; line-height: 1.8; white-space: pre-line; }
    footer { color: #718096; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark shadow-sm mb-5">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="{% url 'home' %}">✍️ Mening blogim</a>
    </div>
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="text-center py-5 mt-5">
    <small>© 2026 Mening blogim. Django bilan yaratilgan.</small>
  </footer>
</body>
</html>
