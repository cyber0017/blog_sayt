{% extends 'posts/base.html' %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-sm rounded-pill mb-4">← Bosh sahifa</a>

    <article class="card border-0 shadow-sm p-4 p-md-5" style="border-radius:16px;">
      <h1 class="fw-bold mb-2">{{ post.title }}</h1>
      <p class="text-muted mb-4">📅 {{ post.created_at|date:"d.m.Y, H:i" }}</p>
      <div class="post-content">{{ post.content }}</div>
    </article>
  </div>
</div>
{% endblock %}
